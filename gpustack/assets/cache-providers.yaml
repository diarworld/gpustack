# Declarative, read-only cache-provider catalog. Loaded by
# gpustack/server/cache_provider_catalog.py and served via
# GET /v2/cache-providers. Providers are shipped with GPUStack releases
# and are not user-editable resources.
#
# Template placeholders available in run_command / run_args / env /
# injection:
#   {{host}}         bind or connect address
#   {{port}}         the port the component is addressed by
#   {{metrics_port}} the port it serves its Prometheus exposition on
#   {{ports.<name>}} any port the component declares, by its own name
#   {{ram_size}}     cache capacity in GiB (service config)
#   {{chunk_size}}   tokens per KV chunk (service or deployment config)
# A component binds a port named `port` and one named `metrics` unless it
# declares `ports`, which then lists every port it binds; `address_port`
# and `metrics_port` say which of them {{port}} and {{metrics_port}}
# mean, and `health_check.target` names the one the probe hits.
# A provider's `fields` add {{<name>}} placeholders carrying
# UI-configured values (falling back to declared defaults); a flag whose
# placeholder renders empty is dropped together with the flag.
# Env entries whose rendered value is empty are dropped.
# A version launches its image one of two ways. run_command is the whole
# argument vector and takes the image's ENTRYPOINT slot, so it names the
# executable too — for images whose entrypoint is something else (e.g. an
# engine server). run_args keeps the image's own entrypoint and is
# appended to it as arguments — for images that start the cache server
# themselves, including ones doing setup around it. The two are
# alternatives; the L2 adapter flags and user parameters join whichever
# vector is declared, or stand alone when neither is.
#
# A version entry inherits default_run_command / default_run_args /
# default_image / default_runtime_images from its provider, so a release
# line with a uniform tag layout declares each version as a bare key.
# The launch pair and the image layout are each inherited as a unit: a
# version declaring one field of a pair owns that pair. {{version}} in
# the image templates renders the version key — optional, for providers
# whose tags embed it. The defaults are folded into every version at
# load, so consumers read one effective image and launch off the version
# config.
- name: LMCache
  display_name: LMCache
  source: built_in
  icon: /static/catalog_icons/lmcache.png
  description:
    default: >-
      LMCache is a KV cache layer for LLM serving. As a shared cache service it
      runs a cache server on every worker; deployments and replicas on the same
      node share KV cache through it, and a shared L2 storage backend extends
      the reuse across nodes.
    zh-CN: >-
      LMCache 是面向大模型推理的 KV Cache 层。作为共享缓存服务，它在每个 worker
      上运行一个缓存服务端，同节点的部署与副本通过它共享 KV Cache，共享的 L2
      存储后端把复用范围扩展到跨节点。
  links:
    - label: { default: Documentation, zh-CN: 文档 }
      url: "https://docs.lmcache.ai"
    # A brand name reads the same in every locale, so it stays bare.
    - { label: GitHub, url: "https://github.com/LMCache/LMCache" }
  # The MP server keeps KV transfers node-local: every worker runs its
  # own cache server instance and engines attach to the one on their
  # node, so managed deployments follow the cluster's workers.
  topology: per_node
  # The MP connector's zero-copy path is CUDA IPC: engines can only
  # attach the cache server on their own node.
  attach_locality: node_local
  # A service may pin a user-supplied image ("custom" version); it runs
  # with the default version's run command and env templates, so the image
  # must be command-compatible.
  custom_version: true
  # The release line is whichever runner images carry the wheel — any of
  # them, not the vLLM ones alone, though today those are the only ones
  # built with it. They are the images rather than upstream's
  # lmcache/vllm-openai because P2P reads go through nixl, which upstream
  # ships as an optional extra its image does not carry. Naming the wheel
  # instead of the images is what keeps a version from naming a release the
  # image does not have, as images come and go.
  #
  # A version names a wheel, not a build of one: the same string is compiled
  # into several images, and nothing pairs the one a cache server runs with
  # the one inside an engine attaching to it — the integration's version
  # range is the whole of what is checked there.
  runner_dependency: lmcache
  # Held to what has been run: the wheel is in the ROCm images too, and
  # whether the engine attaches and the transfer path works there is not
  # something a probe can answer.
  runner_frameworks: [cuda]
  components:
    # Peer discovery for P2P: cache servers register with it and poll it
    # for peers. It holds no cache and no GPU — an in-memory registry,
    # which is why upstream runs exactly one (its own operator says more
    # replicas only help behind a shared durable backend, and none
    # exists). Servers keep serving when it is unreachable; they lose
    # their peers and fall back to local L1 plus static L2.
    coordinator:
      enabled_by: enable_p2p
      gpu_access: false
      # Its own flags, not the server's: the two run different binaries,
      # and a hint that names the other's is a flag the parser rejects.
      # Host and port are the platform's to set.
      common_parameters:
        - --chunk-size
        - --hash-algorithm
        - --instance-timeout
        - --health-check-interval
        - --eviction-check-interval
        - --eviction-ratio
        - --trigger-watermark
        - --metadata-path
        - --checkpoint-path
        - --checkpoint-interval
        - --enable-blend-lookup
        - --blend-probe-stride
        - --timeout-keep-alive
        - --disable-metrics
        - --otlp-endpoint
        - --extra-config
      # One listener, serving both the registry and its health endpoint:
      # a role with nothing to scrape holds no metrics port.
      ports: [port]
      run_command: "lmcache coordinator --host {{host}} --port {{port}}"
      health_check:
        scheme: http
        path: /healthz
    # The registered address is the worker's own rather than the outbound
    # IP the server would guess: a node with several routes (a CNI bridge,
    # a second NIC) can register one its peers cannot reach, and a peer
    # lookup that cannot reach its target is a silent miss, not an error.
    # The cache server engines attach to, one per worker. Its ZMQ port is
    # what peers dial for P2P control, so it binds every interface; the
    # transfer channel's handshake listener takes a port of its own, and
    # the address it advertises has to be the worker's routable one.
    # --l1-align-bytes is fixed rather than offered: peers must agree on
    # it and upstream does not check that they do. With P2P off the two
    # P2P flags render empty and drop, leaving the node-local server
    # this provider has always run.
    server:
      topology: per_node
      attach_endpoint: true
      metrics_port: metrics
      depends_on: coordinator
      ports:
        - name: port
        - name: metrics
        - name: p2p
          enabled_by: enable_p2p
          enabled_when: true
      resource_profile:
        ram_gib: "{{ram_size}}"
        cpu: 2
      run_command: >-
        lmcache server --host {{host}} --port {{port}}
        --l1-size-gb {{ram_size}} --chunk-size {{chunk_size}}
        --http-host {{host}} --http-port {{metrics_port}}
        --supported-transfer-mode auto --worker-reap-timeout-seconds 60
        --eviction-policy {{eviction_policy}}
        --eviction-trigger-watermark {{eviction_trigger_watermark}}
        --eviction-ratio {{eviction_ratio}} --l1-align-bytes 65536
        --coordinator-url http://{{component.coordinator.address}}
        --coordinator-advertise-ip {{worker_ip}}
        --p2p-advertise-url {{ports.p2p.url}}
  resource_profile:
    ram_gib: "{{ram_size}}"
    cpu: 2
    # The server attaches to the node's GPUs to open CUDA IPC handles into
    # the engines' KV buffers; budget ~0.5-1 GiB VRAM per GPU for its CUDA
    # context (not modeled by the scheduler — leave that headroom free).
  # L2 storage: the MP server takes one flag whose value is a JSON object
  # of the form {"type": <backend key>, ...backend-specific fields}.
  # Fields with env_name are read by the server from that env var when
  # absent from the JSON, keeping credentials off the command line.
  # Eviction knobs promoted to structured advanced fields, wired into
  # the run command via their {{name}} placeholders; values and defaults
  # follow the v0.5.2 storage-manager argument group. The eviction
  # policy is required upstream, so its default always renders.
  fields:
    - name: ram_size
      label: { default: RAM Size (GiB), zh-CN: 内存容量（GiB） }
      description:
        default: Cache capacity held in the cache server's memory.
        zh-CN: 缓存服务端在内存中保留的缓存容量。
      type: number
      required: true
      default: 20
      min: 1
      step: 1
    - name: eviction_policy
      label: { default: Eviction Policy, zh-CN: 淘汰策略 }
      default: LRU
      # Engine enum values: they reach the command line verbatim and stay
      # untranslated, so what each one means lives in the description.
      options: [LRU, IsolatedLRU, noop]
      description:
        default: >-
          Controls L1 memory cache eviction independently of L2 storage.
          LRU evicts least-recently-used chunks. IsolatedLRU keeps one LRU
          list per cache salt and requires per-salt quotas via the HTTP
          API. noop never evicts.
        zh-CN: >-
          控制 L1 内存缓存的淘汰，不影响 L2 存储。
          LRU 淘汰最近最少使用的分块。IsolatedLRU 为每个 cache salt 维护独立的 LRU
          列表，并需通过 HTTP API 为每个 salt 设置配额。noop 从不淘汰。
    - name: eviction_trigger_watermark
      label: { default: Eviction Trigger Watermark, zh-CN: 淘汰触发水位 }
      type: number
      default: 0.85
      min: 0
      max: 1
      step: 0.05
      description:
        default: Memory usage fraction (0-1) that triggers eviction.
        zh-CN: 触发淘汰的内存使用率（0-1）。
    - name: eviction_ratio
      label: { default: Eviction Ratio, zh-CN: 淘汰比例 }
      type: number
      default: 0.1
      min: 0
      max: 1
      step: 0.05
      description:
        default: Fraction of memory (0-1) evicted per trigger.
        zh-CN: 每次触发所淘汰的内存比例（0-1）。
    - name: chunk_size
      label: { default: Chunk Size, zh-CN: 分块大小 }
      description:
        default: >-
          Tokens per KV cache chunk. Smaller chunks reuse at finer
          granularity but cost more overhead; empty uses the engine
          default.
        zh-CN: >-
          每个 KV Cache 分块包含的 token
          数。分块越小，复用的粒度越细，开销也越大；留空则使用引擎的默认值。
      type: number
      min: 1
      step: 1
    # Peer-to-peer reads: a server that misses locally pulls the chunk
    # from a peer's cache over the transfer channel, so a deployment sees
    # the fleet's pool rather than its node's. Off by default — it needs
    # the coordinator component and one-sided RDMA through nixl.
    - name: enable_p2p
      label: { default: P2P Reads, zh-CN: P2P 读取 }
      description:
        default: >-
          Let each cache server read chunks from its peers instead of
          recomputing them, turning the per-node caches into one pool.
          Brings up a coordinator component for peer discovery.
        zh-CN: >-
          让每个缓存服务从对端读取数据块，而不是重新计算，把各节点的缓存合成一个池。
          会额外运行一个 coordinator 组件用于节点发现。
      type: boolean
      default: false
  l2_adapter_flag: "--l2-adapter"
  l2_backends:
    fs_native:
      display_name: { default: Local Filesystem, zh-CN: 本地文件系统 }
      description:
        default: >-
          Spills KV cache to a local directory (e.g. NVMe) on the worker.
          Set a positive target capacity and enable automatic cleanup to
          evict cached data in the background. This is not a hard disk quota.
        zh-CN: >-
          将 KV Cache 溢出到 worker 上的本地目录（如 NVMe）。设置大于 0 的目标容量并
          开启自动清理后，会在后台淘汰缓存。这不是磁盘硬配额。
      fields:
        # Defaults into the platform data dir: on containerized workers
        # the mirrored deployment carries the worker's /var/lib/gpustack
        # host mount into the cache container, so spilled cache lands on
        # host disk and survives container recreation.
        - name: base_path
          label: { default: Base Path, zh-CN: 基础路径 }
          required: true
          default: /var/lib/gpustack/cache/lmcache/l2
        - name: max_capacity_gb
          label: { default: Max Capacity (GiB), zh-CN: 最大容量（GiB） }
          description:
            default: >-
              Target capacity for cache tracked by this cache-server instance.
              Usage can temporarily exceed this target. Set to 0 or leave
              empty to prevent capacity-watermark-based automatic cleanup.
            zh-CN: >-
              当前缓存服务实例所统计缓存的目标容量，用量可能短时超过此目标。
              填 0 或留空时，不会触发基于容量水位的自动清理。
          type: number
        - name: auto_cleanup
          label: { default: Automatic Cleanup, zh-CN: 自动清理 }
          description:
            default: >-
              Requires a positive target capacity. Evicts least-recently-used
              L2 cache using LMCache's default watermark and eviction ratio,
              independently of L1 eviction. When disabled, capacity is only
              used for usage tracking and storage usage can keep growing.
            zh-CN: >-
              需设置大于 0 的目标容量。使用 LMCache 默认水位和淘汰比例，按 LRU
              清理 L2 缓存，独立于 L1 淘汰配置。关闭后容量仅用于用量统计，存储占用可能持续增长。
          type: boolean
          default: true
          enabled_adapter_options:
            eviction:
              eviction_policy: LRU
        - name: num_workers
          label: { default: I/O Workers, zh-CN: I/O 工作线程 }
          description:
            default: >-
              Threads the connector reads and writes with, which is its
              effective I/O queue depth. Raise it on storage whose total
              bandwidth exceeds what a single stream reaches (a parallel
              filesystem such as GPFS or Lustre); leave empty for a local
              disk, where the connector's own default serves.
            zh-CN: >-
              连接器读写所用的线程数，也就是它实际的 I/O
              队列深度。当存储的总带宽高于单流带宽时（如 GPFS、Lustre
              等并行文件系统）可以调高；本地磁盘留空即可，连接器自带的默认值足够。
          type: number
        - name: use_odirect
          label: { default: Direct I/O (O_DIRECT), zh-CN: 直接 I/O（O_DIRECT） }
          description:
            default: >-
              Bypasses the page cache, so reads and writes hit the disk
              itself. Takes effect only while each chunk is a multiple of
              the filesystem block size — otherwise that transfer silently
              falls back to buffered I/O. Leave off unless you are measuring
              real disk bandwidth.
            zh-CN: >-
              绕过页缓存，直接读写磁盘。
              仅当数据块的字节数是文件系统块大小的整数倍时才真正生效，否则该次传输会静默回退为带缓存的 I/O。
              除非要测量真实磁盘带宽，否则保持关闭。
          type: boolean
    resp:
      # A brand name reads the same in every locale, so it stays bare.
      display_name: Redis / Valkey
      icon: /static/catalog_icons/redis.svg
      description:
        default: Shared L2 in a Redis or Valkey server; cache survives cache-server restarts.
        zh-CN: 以 Redis 或 Valkey 服务端作为共享 L2；缓存服务端重启后缓存仍然保留。
      fields:
        - { name: host, label: { default: Host, zh-CN: 主机 }, required: true }
        - name: port
          label: { default: Port, zh-CN: 端口 }
          type: number
          required: true
        - name: username
          label: { default: Username, zh-CN: 用户名 }
          env_name: LMCACHE_RESP_USERNAME
        - name: password
          label: { default: Password, zh-CN: 密码 }
          type: password
          env_name: LMCACHE_RESP_PASSWORD
        - name: max_capacity_gb
          label: { default: Max Capacity (GiB), zh-CN: 最大容量（GiB） }
          description:
            default: >-
              Target capacity for cache tracked by this cache-server instance,
              not the Redis/Valkey server-wide memory limit. Usage can
              temporarily exceed this target. Set to 0 or leave empty to
              prevent capacity-watermark-based automatic cleanup.
            zh-CN: >-
              当前缓存服务实例所统计缓存的目标容量，不是 Redis/Valkey 服务端的总内存上限。
              用量可能短时超过此目标。填 0 或留空时，不会触发基于容量水位的自动清理。
          type: number
        - name: auto_cleanup
          label: { default: Automatic Cleanup, zh-CN: 自动清理 }
          description:
            default: >-
              Requires a positive target capacity. Evicts least-recently-used
              L2 cache using LMCache's default watermark and eviction ratio,
              independently of L1 eviction. When disabled, capacity is only
              used for usage tracking and storage usage can keep growing.
            zh-CN: >-
              需设置大于 0 的目标容量。使用 LMCache 默认水位和淘汰比例，按 LRU
              清理 L2 缓存，独立于 L1 淘汰配置。关闭后容量仅用于用量统计，存储占用可能持续增长。
          type: boolean
          default: true
          enabled_adapter_options:
            eviction:
              eviction_policy: LRU
    s3:
      display_name: S3
      icon: /static/catalog_icons/s3.svg
      description:
        default: >-
          Shared L2 in an S3-compatible object store (AWS S3, MinIO, Ceph
          RGW). The endpoint uses virtual-hosted style — the bucket name is
          part of the host, e.g. "kvcache.s3.example.com"; path-style
          addressing is not supported. Set a positive target capacity and
          enable automatic cleanup to evict cached data in the background.
          This is not a bucket-wide storage quota.
        zh-CN: >-
          以兼容 S3 的对象存储作为共享 L2（AWS S3、MinIO、Ceph RGW）。地址采用
          virtual-hosted 风格——bucket 名是主机名的一部分，例如
          "kvcache.s3.example.com"；不支持 path-style 寻址。设置大于 0 的目标容量并
          开启自动清理后，会在后台淘汰缓存。这不是整个 bucket 的存储配额。
      fields:
        - name: s3_endpoint
          label: { default: Bucket Endpoint, zh-CN: Bucket 地址 }
          required: true
        - name: s3_region
          label: { default: Region, zh-CN: 区域 }
          required: true
        # Access Key ID and Secret Access Key are the object store's own
        # credential names; they stay bare, as every S3 console shows them.
        - { name: aws_access_key_id, label: Access Key ID, env_name: AWS_ACCESS_KEY_ID }
        - name: aws_secret_access_key
          label: Secret Access Key
          type: password
          env_name: AWS_SECRET_ACCESS_KEY
        - name: disable_tls
          label: { default: Disable TLS (HTTP Endpoint), zh-CN: 禁用 TLS（HTTP 端点） }
          type: boolean
        - name: max_capacity_gb
          label: { default: Max Capacity (GiB), zh-CN: 最大容量（GiB） }
          description:
            default: >-
              Target capacity for cache tracked by this cache-server instance,
              not a bucket-wide storage quota. Usage can temporarily exceed
              this target. Set to 0 or leave empty to prevent
              capacity-watermark-based automatic cleanup.
            zh-CN: >-
              当前缓存服务实例所统计缓存的目标容量，不是整个 bucket 的存储配额。
              用量可能短时超过此目标。填 0 或留空时，不会触发基于容量水位的自动清理。
          type: number
        - name: auto_cleanup
          label: { default: Automatic Cleanup, zh-CN: 自动清理 }
          description:
            default: >-
              Requires a positive target capacity. Evicts least-recently-used
              L2 cache using LMCache's default watermark and eviction ratio,
              independently of L1 eviction. When disabled, capacity is only
              used for usage tracking and storage usage can keep growing.
            zh-CN: >-
              需设置大于 0 的目标容量。使用 LMCache 默认水位和淘汰比例，按 LRU
              清理 L2 缓存，独立于 L1 淘汰配置。关闭后容量仅用于用量统计，存储占用可能持续增长。
          type: boolean
          default: true
          enabled_adapter_options:
            eviction:
              eviction_policy: LRU
  # Completion hints for the extra-parameters editor. Deliberately
  # excludes the flags GPUStack always renders from structured config.
  common_parameters:
    - --l2-adapter
    # CLI-entry-only groups (coordinator / P2P), which the `lmcache
    # server` entry point accepts.
    - --coordinator-url
    - --p2p-advertise-url
    # A hybrid model (Mamba or Gated-DeltaNet layers beside full
    # attention) needs each attention window stored as its own object
    # group, and the server keeps that off by default.
    - --separate-object-groups
    - --max-workers
    - --max-gpu-workers
    - --max-cpu-workers
    - --hash-algorithm
    - --enable-segmented-prefix
    - --shm-name
    - --worker-reap-timeout-seconds
    - --worker-registration-grace-seconds
    - --l1-use-lazy
    - --l1-init-size-gb
    - --l1-align-bytes
    - --l1-read-ttl-seconds
    - --l1-write-ttl-seconds
    - --gds-l1-path
    - --gds-l1-use-direct-io
    - --l1-devdax-path
    - --l2-store-policy
    - --l2-prefetch-policy
    - --l2-prefetch-max-in-flight
    - --metrics-sample-rate
    - --disable-metrics
    - --disable-logging
    - --disable-observability
    - --enable-tracing
    - --otlp-endpoint
    - --event-bus-queue-size
    - --trace-level
    - --trace-output
  # /healthcheck verifies the engine is initialized (503 until then) —
  # a stronger signal than a TCP connect on the ZMQ port. It lives on
  # the HTTP frontend, the same listener the metrics come from.
  health_check:
    scheme: http
    path: /healthcheck
    target: metrics
  # Metric names follow the LMCache MP observability docs
  # (https://docs.lmcache.ai/mp/observability.html). The mappings feed
  # the cache-service metrics endpoint backing the UI charts.
  # This block is the all-version default; a version that renames
  # metrics (the _GB_per_second suffix is an OTel exporter artifact and
  # a likely candidate) declares its own metrics block, which overrides
  # this one whole for services pinned to it.
  default_metrics:
    path: /metrics
    mappings:
      hit_rate:
        ratio:
          numerator: lmcache_mp_lookup_hit_tokens_total
          denominator: lmcache_mp_lookup_requested_tokens_total
      l1_usage_bytes:
        gauge: lmcache_mp_l1_memory_usage_bytes
      l1_usage_ratio:
        gauge: lmcache_mp_l1_usage_ratio
        aggregate: avg
      # One series per configured L2 adapter (l2_name label). Bytes
      # only: upstream exposes no L2 capacity gauge, so no ratio form.
      l2_usage_bytes:
        gauge: lmcache_mp_l2_usage_bytes
      # Lookup traffic gives the hit-rate chart its denominator context:
      # an empty hit-rate window reads as no traffic, not as a fault.
      lookup_tokens_per_second:
        rate: lmcache_mp_lookup_requested_tokens_total
    throughput:
      l0_l1_store: { histogram_avg: lmcache_mp_l0_l1_store_throughput_GB_per_second }
      l0_l1_load: { histogram_avg: lmcache_mp_l0_l1_load_throughput_GB_per_second }
      l2_store: { histogram_avg: lmcache_mp_l2_store_throughput_GB_per_second }
      l2_load: { histogram_avg: lmcache_mp_l2_load_throughput_GB_per_second }
  inference_backend_integrations:
    # The MP server speaks ZMQ: clients attach through the MP connector
    # pointed at tcp://host:port (the server's --port). The connector
    # advertises hybrid support, so vLLM keeps its hybrid KV cache manager
    # on and none of the injected arguments touch it: forcing it off puts
    # a hybrid model (Mamba or linear-attention layers beside full
    # attention) on the unified-group path, where the two layer kinds have
    # no common cache spec and the engine fails to start.
    # That support comes from the `lmcache` build inside the engine image,
    # not from the name written here: without it vLLM resolves a builtin
    # that does not declare SupportsHMA and turns the hybrid manager off
    # for the member holding the cache. The NIXL compatibility hash covers
    # is_hma_enabled, so that member stops pairing with one that has no
    # cache, and PD pairing fails on a configuration that looks correct.
    # The engine log names the branch taken ("Using external
    # LMCacheMPConnector" vs "falling back to builtin implementation").
    # Engines attach node-local only (the per_node resolver degrades
    # instead of crossing nodes:
    # the engine-driven copy path measures slower than no cache at all),
    # so the placement fact always renders {{mp_transfer_mode}} "auto" —
    # the CUDA-IPC zero-copy path, both containers sharing the host IPC
    # namespace, with host-copy fallback on CPU-only workers.
    # Scoped to the accelerators the connector is validated on — the
    # catalog is the single accelerator gate: on other frameworks the
    # resolver finds no integration and the instance starts degraded
    # with an explicit reason (no half-injection on the worker).
    - backend: vLLM
      frameworks: [cuda]
      # Floor set by the newer of the two requirements: the MP connector
      # integration line validated in-house (v0.25.x) and the injected
      # --shutdown-timeout flag (vllm-project/vllm#36666, first released
      # in v0.25.0).
      versions: ">=0.25.0"
      injection:
        env:
          # The MP token hasher falls back to Python's builtin hash when
          # vLLM's hash function cannot be loaded; without a pinned seed
          # every engine process hashes chunks differently and
          # cross-instance sharing silently never hits.
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: auto }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    # SGLang attaches through --enable-lmcache with a YAML config file
    # carrying the MP server address (the adapter pulls the chunk size
    # from the server itself). Its MP connector shares KV via CUDA IPC
    # with no cross-node fallback, so a SGLang deployment needs a cache
    # instance on its own worker — the per_node topology provides one
    # unless the worker selector excludes that node.
    - backend: SGLang
      frameworks: [cuda]
      # LMCache MP support landed in sglang PR #24089 (merged 2026-05-28);
      # v0.5.13 is the first release carrying it.
      versions: ">=0.5.13"
      injection:
        env:
          # Same builtin-hash fallback guard as the vLLM side.
          PYTHONHASHSEED: "0"
        args:
          - "--enable-lmcache"
          - "--lmcache-config-file"
          - "/tmp/gpustack-lmcache-sgl.yaml"
        files:
          /tmp/gpustack-lmcache-sgl.yaml: |
            mp_host: "{{host}}"
            mp_port: {{port}}
# A provider this installation does not carry. The card holds its place in
# the catalog and reads like any other — what the provider is, what it
# attaches to, where to read about it — with nothing behind it to launch:
# the API refuses a service naming it. An extension that ships the
# provider registers its own catalog asset, whose declaration replaces
# this entry outright.
- name: Mooncake
  display_name: Mooncake
  source: built_in
  icon: /static/catalog_icons/mooncake.png
  description:
    default: >-
      Mooncake Store is a high-performance distributed KV cache pool for
      LLM inference, built on Mooncake's Transfer Engine. It pools the CPU
      DRAM and SSD of a GPU cluster and serves the reusable KV cache held
      there to every engine in it, over TCP or RDMA.
    zh-CN: >-
      Mooncake Store 是面向大模型推理的高性能分布式 KV Cache
      池，构建在 Mooncake Transfer Engine 之上。它把 GPU 集群中的 CPU 内存与 SSD
      汇聚成缓存池，集群内任意引擎都可通过 TCP 或 RDMA 复用其中的 KV Cache。
  links:
    - label: { default: Documentation, zh-CN: 文档 }
      url: "https://kvcache-ai.github.io/Mooncake/"
    - { label: GitHub, url: "https://github.com/kvcache-ai/Mooncake" }
  # Mooncake's master and stores expose their own metric families, so the
  # services' Grafana entries land on the dedicated dashboard provisioned
  # alongside the generic cache-service one
  # (docker-compose/grafana/grafana_dashboards/gpustack-cache-service-mooncake.json).
  dashboard_uid: gpustack-cache-service-mooncake
  # Engines attach cluster-wide: the master coordinates the pool from
  # one place and hands out segment locations wherever the stores run,
  # so an engine on any worker shares the same pool.
  attach_locality: cluster
  # The master and the stores are pure host-DRAM processes - the GPU
  # work happens in the engines attaching to them, which the
  # integrations below scope per accelerator. The upstream image ships
  # a CUDA-linked wheel but vendors stub driver libs, so it imports and
  # runs fine without GPU access; the locally built -cpu wheel image
  # stays as a fallback for when upstream stops publishing.
  default_version: "0.3.14"
  versions:
    0.3.14:
      # Upstream kvcacheai/mooncake:0.3.14, mirrored: docker.io is not
      # reachable from the cluster, the skopeo job that pulled it lives
      # in the ops repo (mirror/mirror-mooncake-upstream.yaml).
      image: gpustack/mooncake:0.3.14
    0.3.13.post1-cpu:
      image: gpustack/mirrored-mooncake:0.3.13.post1-cpu
  components:
    # The pool's coordinator: it holds the key index and the capacity
    # map, hands segments out, and serves the HTTP metadata server the
    # transfer engines bootstrap through. Exactly one; every port it
    # listens on is platform-allocated, and none is guessable from
    # another (the metadata URL is not the RPC address).
    master:
      topology: replicas
      replicas: 1
      attach_endpoint: true
      gpu_access: false
      address_port: rpc
      metrics_port: metrics
      ports: [rpc, metadata, metrics]
      resource_profile:
        ram_gib: "2"
        cpu: 2
      # The flag set the wheel's own master runs with: the metadata
      # server must be on (engines bootstrap through it) and the rest
      # are the knobs promoted to fields below. Multi-tenancy stays
      # off by default because it is all-or-nothing there: a master
      # started with it requires a tenant quota connector (a YAML
      # file or etcd) and refuses to start without one.
      # Operators who want it add --enable_multi_tenants and the
      # connector flags in Parameters beside a quota file they own.
      run_command: >-
        mooncake_master --rpc_port {{port}}
        --enable_http_metadata_server=true --http_metadata_server_host 0.0.0.0
        --http_metadata_server_port {{ports.metadata}}
        --metrics_port {{metrics_port}}
        --default_kv_lease_ttl {{kv_lease_ttl_ms}}
        --eviction_high_watermark_ratio {{eviction_high_watermark_ratio}}
        --eviction_ratio {{eviction_ratio}}
        --logtostderr
      common_parameters:
        - --rpc_thread_num
        - --default_kv_soft_pin_ttl
        - --max_kv_soft_pin_ttl
        - --client_active_ttl_sec
        - --tenant_quota_connector_type
        - --tenant_quota_connector_uri
      health_check:
        scheme: http
        path: /health
        target: metrics
    # The pool's holders, one per cluster worker: each mounts a segment
    # of its node's DRAM into the master's capacity map. Engines never
    # dial a store directly — the master hands out segment locations —
    # so the REST port is management-only and the metrics listener is
    # the client HTTP server (/health for the probe).
    store:
      topology: per_node
      depends_on: master
      enabled_by: mode
      enabled_when: standalone-store
      gpu_access: false
      # The client HTTP server (MOONCAKE_CLIENT_HTTP_PORT, served on the
      # metrics port) also exposes /metrics — the store client's RPC
      # counters and latencies plus the master heartbeat the dashboard's
      # store row reads. Naming it here is what puts store instances on
      # the Prometheus scrape list; the run command needs no flag for it.
      metrics_port: metrics
      ports: [port, metrics]
      resource_profile:
        ram_gib: "{{ram_size}}"
        cpu: 2
      run_command: >-
        python3 -m mooncake.mooncake_store_service --port {{port}}
      # Env, not a config file: the store service reads the same
      # settings from MOONCAKE_* when no --config is passed. The
      # metadata URL is the master's second listener — its host and
      # ports are what the platform stamps for dependents.
      env:
        MOONCAKE_MASTER: "{{component.master.address}}"
        MOONCAKE_TE_META_DATA_SERVER: "http://{{component.master.host}}:{{component.master.ports.metadata}}/metadata"
        MOONCAKE_LOCAL_HOSTNAME: "{{worker_ip}}"
        MOONCAKE_GLOBAL_SEGMENT_SIZE: "{{ram_size}}GB"
        MOONCAKE_LOCAL_BUFFER_SIZE: "{{local_buffer_size}}GB"
        MOONCAKE_PROTOCOL: "{{protocol}}"
        MOONCAKE_DEVICE: "{{device_name}}"
        MOONCAKE_ENABLE_CLIENT_HTTP_SERVER: "true"
        MOONCAKE_CLIENT_HTTP_PORT: "{{ports.metrics}}"
      common_parameters:
        - -D
        - --max-wait-time
      health_check:
        scheme: http
        path: /health
        target: metrics
  fields:
    - name: mode
      label: { default: Mode, zh-CN: 模式 }
      description:
        default: >-
          How the pool's DRAM is held. A standalone store runs dedicated
          per-node store containers that own the pool; embedded has every
          engine contribute a segment of its own memory instead.
        zh-CN: >-
          缓存池内存的持有方式。独立 Store 模式由每节点专属的 Store
          容器持有缓存池；内嵌模式由每个引擎贡献自身的一段内存。
      type: string
      required: true
      default: standalone-store
      options:
        - value: standalone-store
          label: { default: Standalone Store, zh-CN: 独立 Store }
          description:
            default: >-
              Dedicated per-node store containers hold the pool; engines
              contribute no memory of their own.
            zh-CN: >-
              每节点专属的 Store 容器持有缓存池，引擎自身不贡献内存。
        - value: embedded
          label: { default: Embedded, zh-CN: 内嵌 }
          description:
            default: >-
              No store containers; each engine contributes its configured
              segment size to the pool.
            zh-CN: >-
              无 Store 容器，每个引擎按配置的段大小向缓存池贡献内存。
    - name: ram_size
      label: { default: Store RAM Size (GiB), zh-CN: Store 内存容量（GiB） }
      description:
        default: DRAM each per-node store container contributes to the pool.
        zh-CN: 每个节点的 Store 容器向缓存池贡献的内存容量。
      type: number
      required: true
      default: 50
      min: 1
      step: 1
      visible_by: mode
      visible_when: standalone-store
      gated_default: 0
    - name: engine_segment_size
      label: { default: Engine Segment Size (GiB), zh-CN: 引擎段大小（GiB） }
      description:
        default: DRAM each engine contributes to the pool from its own memory.
        zh-CN: 每个引擎从自身内存向缓存池贡献的容量。
      type: number
      required: true
      default: 16
      min: 1
      step: 1
      visible_by: mode
      visible_when: embedded
      # Hidden under a standalone store, the contribution must render 0:
      # the engine config requires global_segment_size == 0 there, and
      # "0GB" is that zero.
      gated_default: 0
    - name: local_buffer_size
      label: { default: Local Buffer Size (GiB), zh-CN: 本地缓冲区大小（GiB） }
      description:
        default: >-
          Per-engine staging buffer for batching writes before they land
          in the pool.
        zh-CN: 每个引擎在写入缓存池前用于批量暂存的本地缓冲区大小。
      type: number
      required: true
      default: 4
      min: 1
      step: 1
    - name: protocol
      label: { default: Transfer Protocol, zh-CN: 传输协议 }
      description:
        default: >-
          Transport the engines and stores move KV bytes over. rdma
          needs RDMA-capable NICs on every node holding or reading the
          pool.
        zh-CN: >-
          引擎与 Store 之间搬运 KV 数据的传输协议。rdma 需要持有或读取
          缓存池的每个节点都具备 RDMA 网卡。
      type: string
      required: true
      default: tcp
      options: [tcp, rdma]
    - name: device_name
      label: { default: RDMA Device, zh-CN: RDMA 设备 }
      description:
        default: >-
          RDMA NIC to use (e.g. mlx5_0); empty lets the transfer engine
          discover one. Only read when the protocol is rdma.
        zh-CN: >-
          使用的 RDMA 网卡（如 mlx5_0）；留空由传输引擎自动发现。仅在
          协议为 rdma 时生效。
      type: string
      default: ""
      visible_by: protocol
      visible_when: rdma
      gated_default: ""
    - name: tenant_id
      label: { default: Tenant ID, zh-CN: 租户 ID }
      description:
        default: >-
          Tenant the attaching engines account their usage under at the
          master. Same value for every engine of the service; "default"
          when quotas are not in play.
        zh-CN: >-
          引擎在 master 处记账所用租户。服务内所有引擎使用同一取值；
          未启用配额时使用 "default"。
      type: string
      default: default
    - name: kv_lease_ttl_ms
      label: { default: KV Lease TTL (ms), zh-CN: KV 租约时长（毫秒） }
      description:
        default: >-
          How long a KV entry stays leased after its last access before
          the master may reclaim it.
        zh-CN: KV 条目在最后一次访问后被 master 回收前保留的租约时长。
      type: number
      default: 30000
      min: 0
      step: 1000
    - name: eviction_high_watermark_ratio
      label:
        { default: Eviction High Watermark, zh-CN: 淘汰高水位 }
      description:
        default: >-
          Pool occupancy fraction that starts eviction; below it, full.
        zh-CN: 触发淘汰的缓存池占用比例；低于该水位视为未满。
      type: number
      default: 0.95
      min: 0
      max: 1
      step: 0.05
    - name: eviction_ratio
      label: { default: Eviction Ratio, zh-CN: 淘汰比例 }
      description:
        default: Fraction of the pool evicted once the watermark trips.
        zh-CN: 触发高水位后单次淘汰的缓存池比例。
      type: number
      default: 0.05
      min: 0
      max: 1
      step: 0.05
  # Metric names read off a running master's /metrics (v0.3.13.post1).
  # The stores' own exposition carries no pool-level numbers, so the
  # mappings only name master families; the platform vocabulary calls
  # the memory tier L1.
  default_metrics:
    path: /metrics
    mappings:
      hit_rate:
        ratio:
          numerator: mem_cache_hit_nums_
          denominator: total_get_nums_
      l1_usage_bytes:
        gauge: master_allocated_bytes
      l1_usage_ratio:
        gauge_ratio:
          numerator: master_allocated_bytes
          denominator: master_total_capacity_bytes
  inference_backend_integrations:
    # Engines attach through vLLM's MooncakeStoreConnector, pointed at
    # the master by a JSON config file the injection writes and an env
    # var naming it. PYTHONHASHSEED pins the block hasher: engines
    # hashing the same chunks differently would store keys no other
    # engine would ever look up. The connector extra config follows the
    # deployment-validated baseline (async lookup with a bounded
    # prefetch window).
    - backend: vLLM
      frameworks: [cuda]
      # The line the in-house PD baseline validated against (the
      # vllm-mooncake recipe below asks the same of its cache service).
      versions: ">=0.29.0"
      injection:
        env:
          # A fixed path: the serving script writes the file inside the
          # engine's own container before the engine starts, so the same
          # name in two deployments never meets.
          MOONCAKE_CONFIG_PATH: /tmp/gpustack-mooncake.json
          PYTHONHASHSEED: "0"
        files:
          /tmp/gpustack-mooncake.json: |
            {
              "mode": "{{mode}}",
              "metadata_server": "http://{{host}}:{{ports.metadata}}/metadata",
              "master_server_address": "{{master_server_address}}",
              "global_segment_size": "{{engine_segment_size}}GB",
              "local_buffer_size": "{{local_buffer_size}}GB",
              "protocol": "{{protocol}}",
              "device_name": "{{device_name}}",
              "tenant_id": "{{tenant_id}}"
            }
        kv_transfer_config:
          kv_connector: MooncakeStoreConnector
          kv_role: kv_both
          kv_connector_extra_config:
            lookup_async: true
            lookup_prefetch_limit: 32
    - backend: vLLM
      frameworks: [cann]
      # The line the vllm-ascend-mooncake PD baseline validated against.
      versions: ">=0.23.0"
      injection:
        env:
          MOONCAKE_CONFIG_PATH: /tmp/gpustack-mooncake.json
          PYTHONHASHSEED: "0"
        files:
          /tmp/gpustack-mooncake.json: |
            {
              "mode": "{{mode}}",
              "metadata_server": "http://{{host}}:{{ports.metadata}}/metadata",
              "master_server_address": "{{master_server_address}}",
              "global_segment_size": "{{engine_segment_size}}GB",
              "local_buffer_size": "{{local_buffer_size}}GB",
              "protocol": "{{protocol}}",
              "device_name": "{{device_name}}",
              "tenant_id": "{{tenant_id}}"
            }
        kv_transfer_config:
          kv_connector: MooncakeStoreConnector
          kv_role: kv_both
          kv_connector_extra_config:
            lookup_async: true
            lookup_prefetch_limit: 32
# PLACEHOLDER. Change as needed.
- name: XSKY MeshFusion
  display_name: XSKY MeshFusion
  source: partner
  icon: /static/catalog_icons/xsky.png
  description:
    default: >-
      XSKY MeshFusion is a KV cache layer for LLM serving. As a shared cache
      service it runs a cache server on every worker; deployments and replicas
      on the same node share KV cache through it, and a shared L2 storage
      backend (e.g. XSKY's store) extends the reuse across nodes.
    zh-CN: >-
      XSKY MeshFusion 是面向大模型推理的 KV Cache 层。作为共享缓存服务，它在每个 worker
      上运行一个缓存服务端，同节点的部署与副本通过它共享 KV Cache，共享的 L2
      存储后端（如 XSKY 的存储）把复用范围扩展到跨节点。
  links:
    - label: { default: Product Page, zh-CN: 产品主页 }
      url: "https://www.xsky.com"
  # XSKY ships the MeshFusion management console; declaring this makes
  # the service form offer the management_url link field.
  management_url: true
  topology: per_node
  # The MP connector's zero-copy path is CUDA IPC: engines can only
  # attach the cache server on their own node.
  attach_locality: node_local
  # MeshFusion images are not published: every service names the image it
  # runs, so the catalog declares no release line and the form asks for an
  # image instead of a version. The launch arguments stay here — they are
  # the whole launch declaration such an entry has, and every image the
  # user names must be compatible with them.
  custom_version: true
  default_run_args: "--host {{host}} --port {{port}} --l1-size-gb {{ram_size}} --chunk-size {{chunk_size}} --http-host {{host}} --http-port {{metrics_port}} --eviction-policy {{eviction_policy}} --eviction-trigger-watermark {{eviction_trigger_watermark}} --eviction-ratio {{eviction_ratio}}"
  resource_profile:
    ram_gib: "{{ram_size}}"
    cpu: 2
  fields:
    - name: ram_size
      label: { default: RAM Size (GiB), zh-CN: 内存容量（GiB） }
      description:
        default: Cache capacity held in the cache server's memory.
        zh-CN: 缓存服务端在内存中保留的缓存容量。
      type: number
      required: true
      default: 20
      min: 1
      step: 1
    - name: eviction_policy
      label: { default: Eviction Policy, zh-CN: 淘汰策略 }
      default: LRU
      options: [LRU, IsolatedLRU, noop]
      description:
        default: >-
          Controls L1 memory cache eviction independently of L2 storage.
          LRU evicts least-recently-used chunks. IsolatedLRU keeps one LRU
          list per cache salt and requires per-salt quotas via the HTTP
          API. noop never evicts.
        zh-CN: >-
          控制 L1 内存缓存的淘汰，不影响 L2 存储。
          LRU 淘汰最近最少使用的分块。IsolatedLRU 为每个 cache salt 维护独立的 LRU
          列表，并需通过 HTTP API 为每个 salt 设置配额。noop 从不淘汰。
    - name: eviction_trigger_watermark
      label: { default: Eviction Trigger Watermark, zh-CN: 淘汰触发水位 }
      type: number
      default: 0.85
      min: 0
      max: 1
      step: 0.05
      description:
        default: Memory usage fraction (0-1) that triggers eviction.
        zh-CN: 触发淘汰的内存使用率（0-1）。
    - name: eviction_ratio
      label: { default: Eviction Ratio, zh-CN: 淘汰比例 }
      type: number
      default: 0.1
      min: 0
      max: 1
      step: 0.05
      description:
        default: Fraction of memory (0-1) evicted per trigger.
        zh-CN: 每次触发所淘汰的内存比例（0-1）。
    - name: chunk_size
      label: { default: Chunk Size, zh-CN: 分块大小 }
      description:
        default: >-
          Tokens per KV cache chunk. Smaller chunks reuse at finer
          granularity but cost more overhead; empty uses the engine
          default.
        zh-CN: >-
          每个 KV Cache 分块包含的 token
          数。分块越小，复用的粒度越细，开销也越大；留空则使用引擎的默认值。
      type: number
      min: 1
      step: 1
  l2_adapter_flag: "--l2-adapter"
  # The store is the only L2 tier MeshFusion is deployed with; a lone
  # declared backend is what the service form preselects.
  l2_backends:
    xdfs:
      display_name: XSKY MeshFusion Store
      icon: /static/catalog_icons/xsky.png
      # The UI exposes this as a separate switch above the fields. It defaults
      # to off because MeshFusion Store normally configures itself in the image.
      adapter_flag_optional: true
      adapter_flag_default: false
      adapter_flag_label:
        default: Enable L2 Adapter Flag
        zh-CN: 启用 L2 适配器参数
      description:
        default: >-
          XSKY MeshFusion Store distributed storage as the L2 tier; capacity
          and durability scale with the external storage cluster.
        zh-CN: >-
          企业级 KV Cache 扩展加速方案，激活 GPU 节点本地 DRAM 与 SSD 加速模型推理。基于端到端的
          NVMe 技术，提供跨节点共享、本地优先读写、自动淘汰策略、主动保护 SSD 寿命等多种能力。
      # The XDFS plugin is exposed through NIXL's dynamic store adapter. Its
      # plugin-specific values belong under backend_params and are strings,
      # including max_capacity_gb.
      adapter_type: nixl_store_dynamic
      adapter_backend: XDFS_KV
      adapter_params:
        conf: conf
        params_file: params_file
        tenant_id: tenant_id
        max_capacity_gb: max_capacity_gb
      fields:
        # The image supplies the plugin files and capacity defaults; tenant is
        # the only service-level override exposed by the form.
        - name: tenant_id
          label: { default: Tenant ID, zh-CN: 租户 ID }
          default: nixl
  common_parameters:
    - --l2-adapter
    # CLI-entry-only groups (coordinator / P2P), which the `lmcache
    # server` entry point accepts.
    - --coordinator-url
    - --p2p-advertise-url
    # A hybrid model (Mamba or Gated-DeltaNet layers beside full
    # attention) needs each attention window stored as its own object
    # group, and the server keeps that off by default.
    - --separate-object-groups
    - --max-workers
    - --max-gpu-workers
    - --max-cpu-workers
    - --hash-algorithm
    - --enable-segmented-prefix
    - --shm-name
    - --worker-reap-timeout-seconds
    - --worker-registration-grace-seconds
    - --l1-use-lazy
    - --l1-init-size-gb
    - --l1-align-bytes
    - --l1-read-ttl-seconds
    - --l1-write-ttl-seconds
    - --gds-l1-path
    - --gds-l1-use-direct-io
    - --l1-devdax-path
    - --l2-store-policy
    - --l2-prefetch-policy
    - --l2-prefetch-max-in-flight
    - --metrics-sample-rate
    - --disable-metrics
    - --disable-logging
    - --disable-observability
    - --enable-tracing
    - --otlp-endpoint
    - --event-bus-queue-size
    - --trace-level
    - --trace-output
  health_check:
    scheme: http
    path: /healthcheck
    target: metrics
  default_metrics:
    path: /metrics
    mappings:
      hit_rate:
        ratio:
          numerator: lmcache_mp_lookup_hit_tokens_total
          denominator: lmcache_mp_lookup_requested_tokens_total
      l1_usage_bytes:
        gauge: lmcache_mp_l1_memory_usage_bytes
      l1_usage_ratio:
        gauge: lmcache_mp_l1_usage_ratio
        aggregate: avg
      # One series per configured L2 adapter (l2_name label). Bytes
      # only: upstream exposes no L2 capacity gauge, so no ratio form.
      l2_usage_bytes:
        gauge: lmcache_mp_l2_usage_bytes
      # Lookup traffic gives the hit-rate chart its denominator context:
      # an empty hit-rate window reads as no traffic, not as a fault.
      lookup_tokens_per_second:
        rate: lmcache_mp_lookup_requested_tokens_total
    throughput:
      l0_l1_store: { histogram_avg: lmcache_mp_l0_l1_store_throughput_GB_per_second }
      l0_l1_load: { histogram_avg: lmcache_mp_l0_l1_load_throughput_GB_per_second }
      l2_store: { histogram_avg: lmcache_mp_l2_store_throughput_GB_per_second }
      l2_load: { histogram_avg: lmcache_mp_l2_load_throughput_GB_per_second }
  inference_backend_integrations:
    - backend: vLLM
      frameworks: [cuda]
      # Floor set by the newer of the two requirements: the MP connector
      # integration line validated in-house (v0.25.x) and the injected
      # --shutdown-timeout flag (vllm-project/vllm#36666, first released
      # in v0.25.0).
      versions: ">=0.25.0"
      injection:
        env:
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: auto }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_connector_module_path: lmcache.integration.vllm.lmcache_mp_connector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    # PLACEHOLDER. Change as needed.
    - backend: vLLM
      frameworks: [cann]
      versions: ">=0.25.0"
      injection:
        env:
          PYTHONHASHSEED: "0"
        locality_params:
          node_local: { mp_transfer_mode: engine_driven }
        kv_transfer_config:
          kv_connector: LMCacheMPConnector
          kv_connector_module_path: lmcache.integration.vllm.lmcache_mp_connector
          kv_role: kv_both
          kv_connector_extra_config:
            lmcache.mp.host: "tcp://{{host}}"
            lmcache.mp.port: "{{port}}"
            lmcache.mp.mp_transfer_mode: "{{mp_transfer_mode}}"
        args:
          # vLLM defaults --shutdown-timeout to 0: on SIGTERM the engine
          # dies without closing its CUDA IPC handles and the driver
          # keeps its KV VRAM charged to the cache server until the
          # server reaps the dead worker. A graceful window inside the
          # container stop grace period (runtime default 30s) releases
          # the VRAM with the instance — best-effort: a lowered
          # termination grace (e.g. k8s terminationGracePeriodSeconds)
          # can still SIGKILL first. User parameters may override.
          - "--shutdown-timeout"
          - "20"
    - backend: SGLang
      frameworks: [cuda]
      # LMCache MP support landed in sglang PR #24089 (merged 2026-05-28);
      # v0.5.13 is the first release carrying it.
      versions: ">=0.5.13"
      injection:
        env:
          PYTHONHASHSEED: "0"
        args:
          - "--enable-lmcache"
          - "--lmcache-config-file"
          - "/tmp/gpustack-lmcache-sgl.yaml"
        files:
          /tmp/gpustack-lmcache-sgl.yaml: |
            mp_host: "{{host}}"
            mp_port: {{port}}
